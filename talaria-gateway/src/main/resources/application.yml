server:
  port: 8080

spring:
  application:
    name: talaria-gateway
  cloud:
    gateway:
      routes:
        - id: invest-route
          uri: lb://talaria-invest
          predicates:
            - Path=/api/invest/**
        - id: notify-route
          uri: lb://talaria-notify
          predicates:
            - Path=/api/notify/**
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 60
            redis-rate-limiter.burstCapacity: 120
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
