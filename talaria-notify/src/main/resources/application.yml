server:
  port: 8082

spring:
  application:
    name: talaria-notify
  datasource:
    url: jdbc:mysql://localhost:3306/talaria_notify?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: talaria
    password: talaria1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: talaria-notify-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "io.github.snuggle.talaria.common.event"
        spring.json.use.type.headers: false
        spring.json.value.default.type: io.github.snuggle.talaria.common.event.StockAnalyzedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  threads:
    virtual:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

logging:
  level:
    io.github.snuggle.talaria: DEBUG

talaria:
  notify:
    channels:
      sms:
        enabled: true
      kakao:
        enabled: true
        api-key: ${KAKAO_API_KEY:}
      telegram:
        enabled: true
        bot-token: ${TELEGRAM_BOT_TOKEN:}
        chat-id: ${TELEGRAM_CHAT_ID:}
      slack:
        enabled: true
        webhook-url: ${SLACK_WEBHOOK_URL:}
    retry:
      max-attempts: 3
      initial-interval-ms: 1000
      multiplier: 2.0
